# ============================================================
# Planning App - HTTPS配置（生产环境主配置）
# ============================================================
# 说明: HTTP配置已移至 planning-app-http.conf
#      本文件仅包含HTTPS配置
# ============================================================

# ============================================================
# HTTPS服务（主服务）
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name txjjzyzqbx.cn www.txjjzyzqbx.cn;

    # ============================================================
    # SSL证书配置
    # ============================================================
    ssl_certificate /etc/letsencrypt/live/txjjzyzqbx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/txjjzyzqbx.cn/privkey.pem;

    # SSL协议版本（仅允许TLS 1.2和1.3）
    ssl_protocols TLSv1.2 TLSv1.3;

    # SSL加密套件（Mozilla推荐）
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # SSL会话票据
    ssl_session_tickets off;

    # OCSP Stapling（提升SSL握手性能）
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/txjjzyzqbx.cn/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ============================================================
    # 安全头配置（Apple App Store审核要求）
    # ============================================================

    # HSTS（强制HTTPS，365天）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止MIME类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # XSS保护
    add_header X-XSS-Protection "1; mode=block" always;

    # 内容安全策略（CSP）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    # Referrer策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 权限策略
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================================
    # 客户端配置
    # ============================================================

    # 客户端上传大小限制
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ============================================================
    # API代理配置
    # ============================================================
    location /api/v1/ {
        # 代理到后端服务
        proxy_pass http://backend:3000/api/v1/;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket支持（如需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 请求体大小限制
        client_max_body_size 10M;

        # 禁用缓存（API动态内容）
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ============================================================
    # 健康检查
    # ============================================================
    location /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ============================================================
    # 根路径（返回API状态页）
    # ============================================================
    location = / {
        return 200 'Planning App API is running\nHTTPS: Enabled ✓\nAPI Endpoint: https://$host/api/v1/\nHealth Check: https://$host/health\n';
        add_header Content-Type text/plain;
    }

    # ============================================================
    # favicon（避免404错误）
    # ============================================================
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # ============================================================
    # robots.txt（SEO）
    # ============================================================
    location = /robots.txt {
        access_log off;
        log_not_found off;
        return 200 "User-agent: *\nDisallow: /api/\n";
        add_header Content-Type text/plain;
    }
}
