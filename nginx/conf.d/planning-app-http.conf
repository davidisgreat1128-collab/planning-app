# ============================================================
# Planning App - HTTP配置（SSL证书申请成功后）
# ============================================================
# 说明: SSL证书已申请成功，HTTP流量全部跳转到HTTPS
#      仅保留 Let's Encrypt 证书续期路径
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name txjjzyzqbx.cn www.txjjzyzqbx.cn;

    # ============================================================
    # Let's Encrypt证书续期路径（必须保留）
    # ============================================================
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    # ============================================================
    # API路径：允许HTTP直接访问（临时方案，用于未备案域名测试）
    # ============================================================
    location /api/v1/ {
        # 代理到后端服务
        proxy_pass http://backend:3000/api/v1/;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 请求体大小限制
        client_max_body_size 10M;
    }

    # ============================================================
    # 所有其他HTTP请求跳转到HTTPS
    # ============================================================
    location / {
        return 301 https://$host$request_uri;
    }
}
