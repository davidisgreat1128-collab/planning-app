# ============================================================
# Planning App - HTTP配置（仅用于SSL证书申请）
# ============================================================
# 说明: 此配置仅在申请SSL证书前使用
#      证书申请成功后，会自动切换到 HTTPS 配置
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name txjjzyzqbx.cn www.txjjzyzqbx.cn;

    # ============================================================
    # 健康检查（不跳转HTTPS）
    # ============================================================
    location /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭健康检查日志（减少日志量）
        access_log off;
    }

    # ============================================================
    # API代理（临时）
    # ============================================================
    location /api/v1/ {
        proxy_pass http://backend:3000/api/v1/;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 请求体大小限制
        client_max_body_size 10M;
    }

    # ============================================================
    # 根路径（返回状态信息）
    # ============================================================
    location / {
        return 200 'Planning App API is running (HTTP mode - waiting for SSL setup)\nAPI Endpoint: http://$host/api/v1/\nDocs: http://$host/api/v1/docs\n';
        add_header Content-Type text/plain;
    }

    # ============================================================
    # Let's Encrypt验证路径（证书申请时使用）
    # ============================================================
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }
}
