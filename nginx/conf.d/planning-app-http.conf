# ============================================================
# Planning App - HTTP配置（SSL证书申请成功后）
# ============================================================
# 说明: SSL证书已申请成功，HTTP流量全部跳转到HTTPS
#      仅保留 Let's Encrypt 证书续期路径
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name txjjzyzqbx.cn www.txjjzyzqbx.cn;

    # ============================================================
    # Let's Encrypt证书续期路径（必须保留）
    # ============================================================
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    # ============================================================
    # 所有其他HTTP请求跳转到HTTPS
    # ============================================================
    location / {
        return 301 https://$host$request_uri;
    }
}
